<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A resilient component demonstrating a loading skeleton.">
    <title>Resilient Component Demo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <p class="eyebrow">Exercise 3 · State modeling</p>
      <h1>Resilient Component Architecture</h1>
      <p>A small component that communicates when service metrics are loading.</p>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="metrics-panel" id="metrics-panel" aria-labelledby="panel-heading" aria-busy="true">
        <header class="panel-header">
          <p class="eyebrow">Service overview</p>
          <h2 id="panel-heading">Platform health</h2>
        </header>
        <p class="sr-only" id="panel-announcement" role="status" aria-live="polite" aria-atomic="true">Loading service metrics.</p>
        <ul class="skeleton-grid" id="loading-state" aria-hidden="true">
          <li class="skeleton-card"><span class="skeleton-line skeleton-short"></span><span class="skeleton-line skeleton-long"></span><span class="skeleton-line skeleton-mid"></span></li>
          <li class="skeleton-card"><span class="skeleton-line skeleton-short"></span><span class="skeleton-line skeleton-long"></span><span class="skeleton-line skeleton-mid"></span></li>
          <li class="skeleton-card"><span class="skeleton-line skeleton-short"></span><span class="skeleton-line skeleton-long"></span><span class="skeleton-line skeleton-mid"></span></li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>Sample data is local so every state can be reproduced without an API.</p>
    </footer>
  </body>
</html>
